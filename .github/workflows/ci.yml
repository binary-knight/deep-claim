name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: debug }
          - { os: ubuntu-24.04, preset: release }
          - { os: ubuntu-24.04, preset: asan }
          - { os: windows-2022, preset: debug }
          - { os: windows-2022, preset: release }
    env:
      # vcpkg removed its x-gha backend; cache built packages as files and
      # let actions/cache persist the directory between runs.
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ matrix.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ matrix.preset }}-

      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\external\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test (unit tests and sim_runner smoke test)
        run: ctest --preset ${{ matrix.preset }}

  game:
    name: ${{ matrix.os }} / game client
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-game-${{ matrix.os }}-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: |
            vcpkg-game-${{ matrix.os }}-
      - name: Install SDL3 system dependencies (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev
          libxss-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl1-mesa-dev
          libgl1-mesa-dev libdrm-dev libgbm-dev pkg-config
      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\external\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure
        run: cmake --preset debug-game
      - name: Build
        run: cmake --build --preset debug-game --parallel
      - name: Test
        run: ctest --preset debug-game

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: git ls-files '*.cpp' '*.h' | xargs clang-format-18 --dry-run -Werror

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-ubuntu-24.04-tidy-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: |
            vcpkg-ubuntu-24.04-tidy-
      - run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy-18
      # Tests are excluded: Catch2 macros do not survive the tidy checks and
      # the test code is not shipped.
      - run: >
          cmake --preset debug -DDC_BUILD_TESTS=OFF
          -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18
      - run: cmake --build --preset debug --parallel
