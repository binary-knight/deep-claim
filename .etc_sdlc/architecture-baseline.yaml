exemplars:
- name: Keyed prose catalogue
  paths:
  - data/strings.json
  - game/session/src/text.cpp
  - game/session/include/game/format.h
  applies_to: any text C++ shows the player (notices, status lines, labels, chips)
  blessed_by: binaryknight
- name: Balance numbers in data
  paths:
  - data/balance.json
  - data/ai.json
  - content/src/loader.cpp
  applies_to: any number a designer would tune; reaches the sim through sim::Content
  blessed_by: binaryknight
- name: Design tokens pipeline
  paths:
  - docs/design/tokens.css
  - tools/design/tokens_to_rcss.py
  - tests/design_tokens_test.cpp
  applies_to: interface colours, type and spacing
  blessed_by: binaryknight
do_not_copy:
- path: 'game/src/ui_model.cpp (short labels and chips: status words, act labels,
    survey flags, research chips, stage states)'
  reason: 'player-facing labels hard-coded in C++. R-002 as ratified holds (owner,
    2026-10-17): the spec 002 comment at ui_model.cpp:34-36 that short labels stay
    literal is superseded; migrate to the catalogue when touched.'
- path: game/session/src/session.cpp:306
  reason: '''Game loaded'' log text hard-coded; use the strings catalogue.'
- path: game/src/app.cpp:167
  reason: rival company name hard-coded; belongs in data.
- path: sim/src/ai_controller.cpp:247
  reason: 1.3x extraction margin hard-coded; balance knobs belong in data/ai.json.
    Move when touched.
- path: sim/include/sim/mines.h:114
  reason: kRunningLowDays=30 hard-coded; belongs in data/balance.json. Move when touched.
- path: sim/src/surveys.cpp:25
  reason: survey shift cap hard-coded; move to data when touched.
- path: docs/design/handoff.md
  reason: 'historical record of the design sprint; six claims do not match the tree.
    Not a source of rules: use ui-design.md, tokens.css and spec 003.'
- path: sim/src/plot_market.cpp:31-32
  reason: unsold-ask and ask-floor multipliers (0.9, 0.5) hard-coded; move to data/balance.json
    when touched (owner, 2026-10-17).
- path: sim/src/worldgen.cpp:26
  reason: initial price noise 1/5 hard-coded; move to data when touched (owner, 2026-10-17).
- path: sim/src/events.cpp:20-21
  reason: event multiplier bounds hard-coded; move to data when touched (owner, 2026-10-17).
- path: sim/src/program.cpp:25
  reason: kLesserPartnerStages = 2 hard-coded; move to data/program.json when touched
    (owner, 2026-10-17).
- path: game/src/ui_model.cpp:781-783
  reason: 'R-001 violation (owner, 2026-10-17): the client decides a storage-cost
    warning at a tenth of cash; the threshold and the warning belong in the sim view.
    Fix in the next client task.'
seams: []
rules:
- id: R-001
  statement: 'The sim is the only authority on game rules: it validates and rejects
    every command. game/ and game/session may derive display and button-enable state
    from view fields, but never a rule the sim does not also enforce.'
  provenance:
    who: binaryknight
    when: '2026-10-17T05:16:48+00:00'
    trigger: ratified 2026-10-10; re-appended in the 2026-10-17 amendment
  mechanizable: false
  enforced_by: human-judgment
- id: R-002
  statement: Anything C++ shows the player goes through the data/strings.json catalogue
    via text(); static headings and button labels in game/assets/ui/main.rml are exempt.
  provenance:
    who: binaryknight
    when: '2026-10-17T05:16:48+00:00'
    trigger: ratified 2026-10-10; re-appended in the 2026-10-17 amendment
  mechanizable: false
  enforced_by: human-judgment
- id: R-003
  statement: Numbers a designer would tune live in data/*.json and reach the sim through
    sim::Content; do not add tuning constants to sim sources.
  provenance:
    who: binaryknight
    when: '2026-10-17T05:16:48+00:00'
    trigger: ratified 2026-10-10; re-appended in the 2026-10-17 amendment
  mechanizable: false
  enforced_by: human-judgment
- id: R-004
